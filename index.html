<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delmet Plant in Your Room</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #0d1114; font-family: 'Segoe UI', Arial, sans-serif; }

  /* -------- schermata di selezione -------- */
  #selettore { padding: 22px 16px 40px; }
  #selettore .header-brand { display: flex; align-items: center; gap: 12px; margin: 6px 4px 18px; }
  #selettore .header-brand img { height: 34px; width: auto; display: block; }
  #selettore h1 {
    color: #fff; font-size: 21px; font-weight: 300; margin: 0 0 2px;
    text-transform: uppercase; letter-spacing: .08em;
  }
  #selettore .sotto { color: #9aa5b1; font-size: 13px; margin: 0 4px 22px; }
  .griglia {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
  }
  .scheda {
    background: #161c24; border: 1px solid #2a323f; border-radius: 12px;
    overflow: hidden; cursor: pointer; text-align: left;
    transition: border-color .15s, transform .15s;
  }
  .scheda:active { transform: scale(.97); border-color: #00A0DC; }
  .scheda .anteprima {
    width: 100%; height: 118px; background: #0d1114;
    --poster-color: #0d1114; pointer-events: none; /* il tocco apre la scheda, non ruota l'anteprima */
  }
  .scheda .anteprima-vuota {
    width: 100%; height: 118px; background: #0d1114;
    display: flex; align-items: center; justify-content: center;
    color: #3a4453; font-size: 28px;
  }
  .scheda .testo { padding: 12px 14px 14px; }
  .scheda .cod { color: #fff; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .scheda .lab { color: #9aa5b1; font-size: 12px; line-height: 1.35; }
  .scheda .stato { display: inline-block; margin-top: 10px; font-size: 10px; padding: 3px 8px;
    border-radius: 20px; background: #23303c; color: #6fb9e0; }

  /* -------- vista AR -------- */
  #vista { position: fixed; inset: 0; z-index: 10; display: none; background: #0d1114; }
  #vista.attiva { display: block; }
  #vista header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    padding: 14px 18px; background: linear-gradient(#0d1114ee, #0d1114 60%, transparent);
    color: #fff; display: flex; align-items: center; gap: 12px;
  }
  #vista .indietro {
    background: #1f2a3a; border: 1px solid #364154; color: #fff; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  #vista .titolo { font-weight: 600; font-size: 15px; letter-spacing: .02em; }
  #vista .sotto { font-size: 12px; color: #9aa5b1; margin-top: 2px; }
  model-viewer { width: 100%; height: 100%; --poster-color: #0d1114; }
  .avviso {
    position: fixed; inset: 0; z-index: 3; background: #0d1114; color: #fff;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 30px; font-size: 14px; line-height: 1.6;
  }
</style>
</head>

  <h1>Delmet Plant in Your Room</h1>
  <div class="sotto">Scegli l'impianto da visualizzare nella tua officina, in scala reale</div>
  <div class="griglia" id="griglia"></div>
</div>

<!-- ============================= VISTA AR =============================== -->
<div id="vista">
  <header>
    <button class="indietro" id="btnIndietro">‹ Indietro</button>
    <div>
      <div class="titolo" id="vTitolo"></div>
      <div class="sotto" id="vSotto">Delmet · Showroom AR</div>
    </div>
  </header>

  <model-viewer
    id="mv"
    alt="Impianto Delmet"
    ar
    ar-modes="scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="fixed"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    poster="">
    <button slot="ar-button" style="
        position:absolute; bottom:64px; left:50%; transform:translateX(-50%);
        background:#00A0DC; color:#fff; border:none; border-radius:24px;
        padding:12px 22px; font-size:14px; font-weight:600; cursor:pointer;">
      Visualizza nella tua officina
    </button>
  </model-viewer>
</div>

<script>
  // Catalogo impianti: id = nome file in assets/ (id.toLowerCase() + .glb / .usdz)
  const IMPIANTI = [
    { id: 'TGL',            code: 'TGL',              label: 'Impianto di elettrolucidatura' },
    { id: 'ELPOLCUBE',      code: 'ELPOL CUBE',        label: 'Impianto di elettrolucidatura' },
    { id: 'OYSTER',         code: 'OYSTER + VASCA',    label: 'Impianto di depurazione acque' },
    { id: 'TP250',          code: 'TP 250',            label: 'Impianto di elettrolucidatura' },
    { id: 'EASYSPRINKLER',  code: 'EASY SPRINKLER',    label: 'Pompa carrellata di spruzzaggio' },
    { id: 'EASYREDOX',      code: 'EASY REDOX',        label: 'Carrello di dosaggio redox' },
    { id: 'SCRUBBER',       code: 'SCRUBBER',          label: 'Torre di abbattimento fumi' },
    { id: 'DPP20',          code: 'DPP 40',            label: 'Impianto di depurazione acque' },
    { id: 'POSEIDON',       code: 'POSEIDON 3x2',      label: 'Cabina di decapaggio' },
    { id: 'SHELL',          code: 'SHELL',             label: 'Impianto di decapaggio ed elettrolucidatura' },
  ];

  const griglia = document.getElementById('griglia');
  const selettore = document.getElementById('selettore');
  const vista = document.getElementById('vista');
  const mv = document.getElementById('mv');
  const vTitolo = document.getElementById('vTitolo');

  IMPIANTI.forEach(imp => {
    const nome = imp.id.toLowerCase();
    const el = document.createElement('button');
    el.className = 'scheda';
    el.innerHTML = `
      <model-viewer class="anteprima"
        src="assets/${nome}.glb"
        camera-controls="false" auto-rotate auto-rotate-delay="0"
        rotation-per-second="18deg" disable-zoom interaction-prompt="none"
        exposure="1" shadow-intensity="0.6" environment-image="neutral" loading="lazy">
      </model-viewer>
      <div class="testo">
        <div class="cod">${imp.code}</div>
        <div class="lab">${imp.label}</div>
        <div class="stato">Visualizza in AR</div>
      </div>
    `;
    // se il modello non è ancora stato esportato, sostituisco l'anteprima 3D con un placeholder
    const mvPreview = el.querySelector('model-viewer');
    mvPreview.addEventListener('error', () => {
      const vuota = document.createElement('div');
      vuota.className = 'anteprima-vuota';
      vuota.textContent = '⛭';
      mvPreview.replaceWith(vuota);
    }, { once: true });
    el.addEventListener('click', () => apriAR(imp));
    griglia.appendChild(el);
  });

  function apriAR(imp) {
    const nome = imp.id.toLowerCase();
    mv.src = 'assets/' + nome + '.glb';
    mv.iosSrc = 'assets/' + nome + '.usdz';
    vTitolo.textContent = imp.code;
    selettore.style.display = 'none';
    vista.classList.add('attiva');

    // avviso se il modello non è stato ancora esportato/caricato in assets/
    const gestisciErrore = () => {
      const div = document.createElement('div');
      div.className = 'avviso';
      div.innerHTML = `Il modello 3D di <b>${imp.code}</b> non è ancora presente in <code>assets/${nome}.glb</code>.<br><br>`
        + `Esportalo dallo strumento in <code>/exporter/</code> e caricalo in questa cartella.`;
      vista.appendChild(div);
    };
    mv.addEventListener('error', gestisciErrore, { once: true });
  }

  document.getElementById('btnIndietro').addEventListener('click', () => {
    vista.classList.remove('attiva');
    selettore.style.display = 'block';
    vista.querySelectorAll('.avviso').forEach(a => a.remove());
  });
</script>

</body>
</html>
